# Game header images, keyed by slug (the filename stem used in markdown ![](slug.jpg)).
# Hugo fetches `image` at build time via resources.GetRemote and processes it to WebP.
#
# `alt` is the accessibility description of what the artwork actually shows, one string
# per site language. It lives here rather than in i18n/ so it stays attached to the image
# it describes. Every game MUST carry a non-empty alt for every language: layouts/partials/
# game-image.html fails the build otherwise, which is what keeps the site free of
# undescribed images.

# Steam CDN headers (460x215 JPEG, permanent content-addressed URLs)
