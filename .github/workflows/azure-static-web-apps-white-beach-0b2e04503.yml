name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build Site
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - name: Install Hugo
        run: |
          HUGO_VERSION=0.160.0
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar xzf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          sudo mv hugo /usr/local/bin/hugo
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci
      - name: Build Tailwind CSS
        run: npm run build:css
      - name: Build Hugo site
        run: hugo --environment production --minify
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: public/
          if-no-files-found: error
          retention-days: 1

  deploy_azure:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Azure Static Web Apps
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: public/
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_BEACH_0B2E04503 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/public"
          api_location: ""
          output_location: "."
          skip_app_build: true

  publish_oci:
    needs: build
    runs-on: ubuntu-latest
    name: Build and Publish OCI Image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: public/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=pr
      - name: Build and publish OCI image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      pull-requests: write
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_BEACH_0B2E04503 }}
          action: "close"
